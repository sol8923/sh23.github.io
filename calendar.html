<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일정 공유 달력</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; }
    
    /* 레이아웃 구조 세팅 */
    .main-header-area { display: flex; gap: 20px; align-items: center; margin-bottom: 15px; }
    .calendar-header-col { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
    .side-spacer { width: 160px; flex-shrink: 0; }
    
    .main-content-area { display: flex; gap: 20px; align-items: flex-start; }
    .calendar-content-col { flex: 1; min-width: 0; }

    /* 헤더 및 버튼 스타일 */
    .btn-setting { background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
    .btn-setting:hover { background: #5a6268; }
    
    .month-title-wrap { display: flex; align-items: center; gap: 15px; }
    .month-title-wrap h2 { margin: 0; min-width: 130px; text-align: center; }
    .btn-arrow { padding: 5px 12px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: white; font-weight: bold; }
    .btn-arrow:hover { background: #f0f0f0; }
    .btn-today { padding: 5px 10px; font-size: 13px; font-weight: bold; background: #e2e3e5; color: #333; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
    .btn-today:hover { background: #d6d8db; }

    /* 달력 그리드 */
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .day-name { font-weight: bold; padding: 10px; background: #f0f0f0; border-radius: 4px; }
    .day-name.sun { color: red; }
    .day-name.sat { color: blue; }
    
    .date-cell { border: 1px solid #ddd; border-radius: 4px; height: 110px; padding: 5px; cursor: pointer; text-align: left; display: flex; flex-direction: column; overflow: hidden; transition: all 0.3s; }
    .date-cell:hover { background: #f8f9fa; border-color: #007bff; }
    .date-cell .date-num { font-weight: bold; }
    .date-cell.sun .date-num { color: red; }
    .date-cell.sat .date-num { color: blue; }
    .date-cell.holiday .date-num { color: red; }
    .holiday-name { font-size: 11px; color: red; margin-top: 2px; font-weight: bold; }
    
    .event-container { margin-top: 5px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .event-item { padding: 3px 4px; border-radius: 3px; font-size: 11px; color: #333; line-height: 1.2; word-break: break-all; }

    /* 반짝임 애니메이션 */
    @keyframes highlight-cell {
      0% { background-color: #fff3cd; transform: scale(1.02); border-color: #ffc107; box-shadow: 0 0 10px rgba(255, 193, 7, 0.5); }
      100% { background-color: transparent; transform: scale(1); border-color: #ddd; box-shadow: none; }
    }
    .highlight-anim { animation: highlight-cell 1.5s ease-out; }

    /* 우측 부재 일정 패널 */
    .side-section { width: 160px; background: #f8f9fa; padding: 15px 10px; border-radius: 8px; border: 1px solid #e9ecef; flex-shrink: 0; box-sizing: border-box; }
    .side-header { margin-top: 0; font-size: 14px; color: #333; border-bottom: 2px solid #dc3545; padding-bottom: 8px; margin-bottom: 12px; font-weight: bold; text-align: center; }
    .side-list { list-style: none; padding: 0; margin: 0; font-size: 12px; }
    .side-list li { margin-bottom: 5px; padding: 8px; border-bottom: 1px dashed #ddd; cursor: pointer; transition: background 0.2s; border-radius: 4px; }
    .side-list li:hover { background: #e9ecef; }
    .side-list li:last-child { border-bottom: none; margin-bottom: 0; }
    .side-date { color: #666; font-size: 10px; margin-bottom: 3px; }
    .side-person { font-weight: bold; color: #000; font-size: 13px; }

    /* 팝업(모달) 공통 스타일 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .modal-content h3 { margin: 0 0 5px 0; }
    .modal-content label { font-weight: bold; font-size: 0.9em; color: #555; }
    .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-top: 3px; }
    .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    
    .btn-edit { background: #17a2b8; color: white; border: none; padding: 4px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; }
    .btn-edit:hover { background: #138496; }
    .btn-delete { background: #dc3545; color: white; border: none; padding: 4px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; }
    .btn-delete:hover { background: #c82333; }
  </style>
</head>
<body>

  <div class="main-header-area">
    <div class="calendar-header-col">
      <div class="month-title-wrap">
        <button class="btn-arrow" onclick="changeMonth(-1)">◀</button>
        <h2 id="month-title"></h2>
        <button class="btn-arrow" onclick="changeMonth(1)">▶</button>
        <button class="btn-today" onclick="goToToday()">오늘</button>
      </div>
      <button class="btn-setting" onclick="openSettingsModal()">⚙️ 설정 (토큰/항목)</button>
    </div>
    <div class="side-spacer"></div>
  </div>

  <div class="main-content-area">
    <div class="calendar-content-col">
      <div class="grid" id="calendar-days">
        <div class="day-name sun">일</div><div class="day-name">월</div><div class="day-name">화</div>
        <div class="day-name">수</div><div class="day-name">목</div><div class="day-name">금</div><div class="day-name sat">토</div>
      </div>
      <div class="grid" id="calendar-grid"></div>
    </div>
    <div class="side-section">
      <h3 class="side-header">🏖️ 부재 일정</h3>
      <div id="side-event-list"></div>
    </div>
  </div>

  <!-- 날짜 클릭 시 나타나는 미니 팝업 -->
  <div id="action-modal" class="modal">
    <div class="modal-content" style="width: 350px;">
      <h3 id="action-date-title">일정 확인</h3>
      <div id="action-event-list" style="display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto; margin-bottom:5px;"></div>
      <div class="btn-group" style="justify-content: space-between; border-top: 1px solid #eee; padding-top: 15px;">
        <button onclick="closeActionModal()">닫기</button>
        <button onclick="openScheduleModalFromAction()" style="background:#28a745; color:white; border:none; font-weight:bold;">+ 새 일정 추가</button>
      </div>
    </div>
  </div>

  <!-- 일정 등록/수정 팝업창 -->
  <div id="schedule-modal" class="modal">
    <div class="modal-content">
      <h3 id="schedule-modal-title">일정 등록</h3>
      <div><label>시작 날짜</label><input type="date" id="start-date"></div>
      <div><label>종료 날짜</label><input type="date" id="end-date"></div>
      <div>
        <label>일정 종류</label>
        <select id="event-type" onchange="togglePersonField()"></select>
      </div>
      <div id="person-container">
        <label>인원</label>
        <select id="event-person"></select>
      </div>
      <div><label>세부 내용</label><textarea id="event-details" rows="3" placeholder="내용을 입력하세요"></textarea></div>
      <div class="btn-group">
        <button onclick="closeModal()">취소</button>
        <button onclick="saveData('schedule')" style="background:#007bff; color:white; border:none;">저장 및 동기화</button>
      </div>
    </div>
  </div>

  <!-- 환경 설정 팝업창 -->
  <div id="settings-modal" class="modal">
    <div class="modal-content" style="width: 340px;">
      <h3>⚙️ 환경 설정</h3>
      <div>
        <label>🔑 관리자 토큰 <span style="font-weight:normal; font-size:0.9em; color:#007bff;">(자동 저장)</span></label>
        <input type="password" id="github-token" placeholder="github_pat_... 붙여넣기" oninput="localStorage.setItem('calendar_github_token', this.value)">
      </div>
      <hr style="border:0; border-top:1px solid #ddd; margin:15px 0;">
      <p style="font-size:0.9em; font-weight:bold; color:#333; margin:0 0 5px 0;">달력 옵션 항목 <span style="font-size:0.85em; color:#666; font-weight:normal;">(쉼표로 구분)</span></p>
      <div><label>일정 종류 목록</label><input type="text" id="config-types"></div>
      <div><label>인원 목록</label><input type="text" id="config-persons"></div>
      <div class="btn-group" style="margin-top: 15px;">
        <button onclick="closeSettingsModal()">닫기</button>
        <button onclick="saveData('settings')" style="background:#28a745; color:white; border:none;">항목 동기화</button>
      </div>
    </div>
  </div>

  <script>
    const REPO = "sol8923/sh23.github.io";
    const FILE_PATH = "schedule.json";
    const API_URL = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;
    
    let currentDate = new Date();
    let selectedDateStr = "";
    let editingEventId = null;
    
    let appData = {
      settings: { types: ["업무", "부재", "기타"], persons: ["인원1", "인원2", "인원3"] },
      events: []
    };

    const colors = [
      { bg: "#d4edda", bd: "#28a745" }, { bg: "#f8d7da", bd: "#dc3545" },
      { bg: "#fff3cd", bd: "#ffc107" }, { bg: "#d1ecf1", bd: "#17a2b8" },
      { bg: "#e2e3e5", bd: "#6c757d" }, { bg: "#e8dbff", bd: "#6f42c1" }
    ];

    const fixedHolidays = {
      "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일",
      "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "크리스마스"
    };
    const yearlyHolidays = {
      "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
      "2026-03-02": "대체공휴일", "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
      "2026-08-17": "대체공휴일", "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴"
    };

    const savedToken = localStorage.getItem("calendar_github_token");
    if (savedToken) document.getElementById("github-token").value = savedToken;

    function getLocalYYYYMMDD(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    async function fetchSchedule() {
      try {
        const token = document.getElementById("github-token").value;
        const headers = {};
        if (token) headers["Authorization"] = `token ${token}`;

        const res = await fetch(API_URL + "?t=" + new Date().getTime(), { headers });
        
        if (res.ok) {
          const data = await res.json();
          const parsed = JSON.parse(decodeURIComponent(escape(atob(data.content))));
          if (Array.isArray(parsed)) appData.events = parsed;
          else appData = parsed;
        } else if (res.status === 403) {
          console.warn("데이터 조회 제한에 걸렸으나 화면은 띄웁니다.");
        }
      } catch (e) { console.error("데이터 로드 실패", e); }
      
      updateSelectOptions();
      renderCalendar();
    }

    function updateSelectOptions() {
      const typeSelect = document.getElementById("event-type");
      const personSelect = document.getElementById("event-person");
      typeSelect.innerHTML = appData.settings.types.map(t => `<option value="${t}">${t}</option>`).join('');
      personSelect.innerHTML = appData.settings.persons.map(p => `<option value="${p}">${p}</option>`).join('');
      togglePersonField();
    }

    function togglePersonField() {
      const typeSelect = document.getElementById("event-type");
      const personContainer = document.getElementById("person-container");
      if(!typeSelect.value) return;
      
      const isAbsence = ["부재", "휴가", "연차", "반차"].some(k => typeSelect.value.includes(k));
      if (isAbsence) personContainer.style.display = "block";
      else personContainer.style.display = "none";
    }

    function renderCalendar() {
      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";
      
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById("month-title").innerText = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for(let i=0; i<firstDay; i++) { grid.innerHTML += `<div class="date-cell" style="background:transparent; border-color:transparent;"></div>`; }

      for(let i=1; i<=lastDate; i++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        const monthDayStr = `${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        const dayOfWeek = new Date(year, month, i).getDay();
        
        let cellClass = "date-cell";
        if (dayOfWeek === 0) cellClass += " sun";
        if (dayOfWeek === 6) cellClass += " sat";

        let holidayName = yearlyHolidays[dateStr] || fixedHolidays[monthDayStr];
        let holidayHtml = holidayName ? `<div class="holiday-name">${holidayName}</div>` : "";
        if (holidayName) cellClass += " holiday";

        let eventsHtml = "";
        appData.events.forEach(evt => {
          if (dateStr >= evt.startDate && dateStr <= evt.endDate) {
            const typeIndex = Math.max(0, appData.settings.types.indexOf(evt.type));
            const color = colors[typeIndex % colors.length];
            
            const isAbsence = ["부재", "휴가", "연차", "반차"].some(k => evt.type.includes(k));
            const personText = isAbsence ? ` ${evt.person}` : ""; 
            
            eventsHtml += `
              <div class="event-item" style="background:${color.bg}; border-left:3px solid ${color.bd};">
                <strong>[${evt.type}]</strong>${personText} <br>
                <span style="color:#666;">${evt.details}</span>
              </div>
            `;
          }
        });

        grid.innerHTML += `
          <div id="cell-${dateStr}" class="${cellClass}" onclick="handleDayClick('${dateStr}')">
            <span class="date-num">${i}</span>
            ${holidayHtml}
            <div class="event-container">${eventsHtml}</div>
          </div>
        `;
      }
      
      renderSidePanel();
    }

    function renderSidePanel() {
      const listContainer = document.getElementById("side-event-list");
      listContainer.innerHTML = "";

      const now = new Date();
      const startLimitDate = new Date(now);
      startLimitDate.setDate(now.getDate() - 7);
      const endLimitDate = new Date(now);
      endLimitDate.setDate(now.getDate() + 60);

      const startLimitStr = getLocalYYYYMMDD(startLimitDate);
      const endLimitStr = getLocalYYYYMMDD(endLimitDate);

      let targetEvents = appData.events.filter(evt => {
        const isAbsence = ["부재", "휴가", "연차", "반차"].some(k => evt.type.includes(k));
        if (!isAbsence) return false;
        return evt.endDate >= startLimitStr && evt.startDate <= endLimitStr;
      });

      targetEvents.sort((a, b) => a.startDate.localeCompare(b.startDate));

      if(targetEvents.length === 0) {
        listContainer.innerHTML = "<div style='color:#999; font-size:12px; text-align:center; margin-top:20px;'>부재 일정이 없습니다.</div>";
        return;
      }

      let html = "<ul class='side-list'>";
      targetEvents.forEach(evt => {
        const sDate = evt.startDate.substring(5).replace("-", "."); 
        const eDate = evt.endDate.substring(5).replace("-", ".");
        const dateText = (evt.startDate === evt.endDate) ? sDate : `${sDate} ~ ${eDate}`;
        
        html += `
          <li onclick="focusOnDate('${evt.startDate}', true)" title="클릭하면 달력이 이동합니다">
            <div class="side-date">${dateText}</div>
            <div class="side-person">${evt.person}</div>
          </li>
        `;
      });
      html += "</ul>";
      listContainer.innerHTML = html;
    }

    // [보완] 달력을 특정 날짜로 넘기고 반짝임 효과. 
    // isFromPanel: 사이드 패널에서 누른 경우에만 팝업 오픈 (오늘 버튼은 팝업 안 띄움)
    function focusOnDate(dateStr, isFromPanel = false) {
      const parts = dateStr.split('-');
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10) - 1; 
      
      currentDate = new Date(year, month, 1);
      renderCalendar();

      setTimeout(() => {
        const cell = document.getElementById(`cell-${dateStr}`);
        if (cell) {
          cell.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
          cell.classList.add('highlight-anim');
          
          if (isFromPanel) {
            setTimeout(() => {
              handleDayClick(dateStr);
              cell.classList.remove('highlight-anim');
            }, 300);
          } else {
            // 오늘 버튼 클릭 시: 팝업 안 띄우고 애니메이션 끝난 뒤 클래스만 제거
            setTimeout(() => {
              cell.classList.remove('highlight-anim');
            }, 1500);
          }
        }
      }, 50);
    }

    function changeMonth(step) {
      currentDate.setMonth(currentDate.getMonth() + step);
      renderCalendar();
    }

    // [업데이트] 오늘 버튼 클릭 시, 오늘 날짜로 달력 이동 및 반짝임 효과 (팝업 제외)
    function goToToday() {
      const now = new Date();
      const todayStr = getLocalYYYYMMDD(now);
      focusOnDate(todayStr, false);
    }

    function handleDayClick(dateStr) {
      selectedDateStr = dateStr;
      const dayEvents = appData.events.filter(evt => dateStr >= evt.startDate && dateStr <= evt.endDate);
      
      if (dayEvents.length > 0) {
        document.getElementById("action-date-title").innerText = `${dateStr} 일정`;
        const listDiv = document.getElementById("action-event-list");
        listDiv.innerHTML = "";
        
        dayEvents.forEach(evt => {
          const typeIndex = Math.max(0, appData.settings.types.indexOf(evt.type));
          const color = colors[typeIndex % colors.length];
          const isAbsence = ["부재", "휴가", "연차", "반차"].some(k => evt.type.includes(k));
          const personText = isAbsence ? ` ${evt.person}` : "";
          
          listDiv.innerHTML += `
            <div style="display:flex; justify-content:space-between; align-items:center; background:${color.bg}; border-left:3px solid ${color.bd}; padding:8px; border-radius:4px;">
              <div style="font-size: 13px;">
                <strong>[${evt.type}]</strong>${personText} <br>
                <span style="color:#555;">${evt.details}</span>
              </div>
              <div style="display:flex; gap:5px; flex-shrink:0;">
                <button class="btn-edit" onclick="editSchedule(${evt.id})">수정</button>
                <button class="btn-delete" onclick="deleteSchedule(${evt.id}, this)">삭제</button>
              </div>
            </div>
          `;
        });
        document.getElementById('action-modal').style.display = 'flex';
      } else {
        openScheduleModal(dateStr);
      }
    }

    function closeActionModal() { document.getElementById('action-modal').style.display = 'none'; }
    function openScheduleModalFromAction() { closeActionModal(); openScheduleModal(selectedDateStr); }

    function openScheduleModal(date) {
      editingEventId = null; 
      document.getElementById('schedule-modal-title').innerText = "새 일정 등록";
      document.getElementById('start-date').value = date;
      document.getElementById('end-date').value = date;
      document.getElementById('event-details').value = "";
      if(appData.settings.types.length > 0) document.getElementById('event-type').value = appData.settings.types[0];
      togglePersonField();
      document.getElementById('schedule-modal').style.display = 'flex';
    }
    
    function editSchedule(eventId) {
      closeActionModal();
      const evt = appData.events.find(e => String(e.id) === String(eventId));
      if (!evt) return;
      
      editingEventId = eventId;
      document.getElementById('schedule-modal-title').innerText = "일정 수정";
      document.getElementById('start-date').value = evt.startDate;
      document.getElementById('end-date').value = evt.endDate;
      document.getElementById('event-type').value = evt.type;
      togglePersonField();
      if (evt.person) document.getElementById('event-person').value = evt.person;
      document.getElementById('event-details').value = evt.details;
      
      document.getElementById('schedule-modal').style.display = 'flex';
    }
    
    function closeModal() {
      document.getElementById('schedule-modal').style.display = 'none';
      editingEventId = null;
    }

    function openSettingsModal() {
      document.getElementById('config-types').value = appData.settings.types.join(", ");
      document.getElementById('config-persons').value = appData.settings.persons.join(", ");
      document.getElementById('settings-modal').style.display = 'flex';
    }
    
    function closeSettingsModal() { document.getElementById('settings-modal').style.display = 'none'; }

    async function deleteSchedule(eventId, btnEl) {
      if (!confirm("이 일정을 정말 삭제하시겠습니까?")) return;
      const token = document.getElementById("github-token").value;
      if (!token) { alert("우측 상단의 ⚙️ 설정 메뉴에서 관리자 토큰을 먼저 입력해 주세요."); return; }

      btnEl.innerText = "삭제 중...";
      btnEl.disabled = true;

      try {
        const getRes = await fetch(API_URL + "?t=" + new Date().getTime(), { headers: { "Authorization": `token ${token}` } });
        if (!getRes.ok) throw new Error("최신 데이터를 가져오지 못했습니다.");
        
        const getData = await getRes.json();
        let latestData = JSON.parse(decodeURIComponent(escape(atob(getData.content))));
        if (Array.isArray(latestData)) latestData = { settings: appData.settings, events: latestData };

        latestData.events = latestData.events.filter(evt => String(evt.id) !== String(eventId));

        const putRes = await fetch(API_URL, {
          method: "PUT",
          headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ message: "일정 삭제", content: btoa(unescape(encodeURIComponent(JSON.stringify(latestData, null, 2)))), sha: getData.sha })
        });

        if (putRes.ok) {
          appData = latestData;
          closeActionModal();
          renderCalendar();
          alert("일정이 삭제되었습니다.");
        } else alert("삭제 실패: 권한을 확인하세요.");
      } catch (e) {
        console.error(e); alert("오류가 발생했습니다.");
      }
    }

    async function saveData(mode) {
      const token = document.getElementById("github-token").value;
      if (!token) { alert("우측 상단의 ⚙️ 설정 메뉴에서 관리자 토큰을 먼저 입력해 주세요."); return; }

      let btn = null;
      try {
        const getRes = await fetch(API_URL + "?t=" + new Date().getTime(), { headers: { "Authorization": `token ${token}` } });
        if (!getRes.ok) throw new Error("최신 데이터를 가져오지 못했습니다.");
        
        const getData = await getRes.json();
        let latestData = JSON.parse(decodeURIComponent(escape(atob(getData.content))));
        if (Array.isArray(latestData)) latestData = { settings: appData.settings, events: latestData };

        if (mode === 'schedule') {
          const start = document.getElementById("start-date").value;
          const end = document.getElementById("end-date").value;
          if(start > end) { alert("종료 날짜 오류"); return; }
          
          btn = document.querySelector("#schedule-modal .btn-group button:last-child");
          btn.innerText = "저장 중...";
          
          if (editingEventId) {
            const idx = latestData.events.findIndex(e => String(e.id) === String(editingEventId));
            if (idx !== -1) {
              latestData.events[idx].startDate = start;
              latestData.events[idx].endDate = end;
              latestData.events[idx].type = document.getElementById("event-type").value;
              latestData.events[idx].person = document.getElementById("event-person").value;
              latestData.events[idx].details = document.getElementById("event-details").value;
            }
          } else {
            latestData.events.push({
              id: Date.now(), startDate: start, endDate: end,
              type: document.getElementById("event-type").value,
              person: document.getElementById("event-person").value,
              details: document.getElementById("event-details").value
            });
          }
        } else if (mode === 'settings') {
          btn = document.querySelector("#settings-modal .btn-group button:last-child");
          btn.innerText = "저장 중...";
          const newTypes = document.getElementById('config-types').value.split(',').map(s => s.trim()).filter(s => s);
          const newPersons = document.getElementById('config-persons').value.split(',').map(s => s.trim()).filter(s => s);
          latestData.settings = { types: newTypes, persons: newPersons };
        }
        btn.disabled = true;

        const putRes = await fetch(API_URL, {
          method: "PUT",
          headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ message: mode === 'schedule' ? (editingEventId ? "일정 수정" : "일정 추가") : "설정 변경", content: btoa(unescape(encodeURIComponent(JSON.stringify(latestData, null, 2)))), sha: getData.sha })
        });

        if (putRes.ok) {
          appData = latestData;
          if(mode === 'schedule') {
            alert("일정이 성공적으로 저장/수정되었습니다!");
            closeModal();
          } else {
            alert("설정 항목이 성공적으로 동기화되었습니다!");
            updateSelectOptions();
            closeSettingsModal();
          }
          renderCalendar();
        } else {
          alert("권한 오류: 토큰을 다시 확인하세요.");
        }
      } catch (e) {
        console.error(e); alert("통신 중 오류가 발생했습니다.");
      } finally {
        if(btn) { btn.innerText = mode === 'schedule' ? "저장 및 동기화" : "항목 동기화"; btn.disabled = false; }
      }
    }

    fetchSchedule();
  </script>
</body>
</html>
