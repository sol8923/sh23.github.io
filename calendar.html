<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일정 공유 달력</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; }
    .top-bar { display: flex; justify-content: flex-end; margin-bottom: 10px; font-size: 0.9em; }
    .top-bar input { padding: 4px; width: 250px; margin-left: 10px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    button { padding: 5px 15px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: white; }
    button:hover { background: #f0f0f0; }
    
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .day-name { font-weight: bold; padding: 10px; background: #f0f0f0; border-radius: 4px; }
    .day-name.sun { color: red; }
    .day-name.sat { color: blue; }
    
    .date-cell { border: 1px solid #ddd; border-radius: 4px; height: 110px; padding: 5px; cursor: pointer; text-align: left; display: flex; flex-direction: column; overflow: hidden; }
    .date-cell:hover { background: #f8f9fa; border-color: #007bff; }
    .date-cell .date-num { font-weight: bold; }
    .date-cell.sun .date-num { color: red; }
    .date-cell.sat .date-num { color: blue; }
    .date-cell.holiday .date-num { color: red; }
    .holiday-name { font-size: 11px; color: red; margin-top: 2px; font-weight: bold; }
    
    .event-container { margin-top: 5px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .event-item { padding: 3px 4px; border-radius: 3px; font-size: 11px; color: #333; line-height: 1.2; word-break: break-all; }
    .type-업무 { background: #d4edda; border-left: 3px solid #28a745; }
    .type-부재 { background: #f8d7da; border-left: 3px solid #dc3545; }
    .type-기타 { background: #fff3cd; border-left: 3px solid #ffc107; }

    /* 팝업(모달) 스타일 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .modal-content h3 { margin: 0 0 10px 0; }
    .modal-content label { font-weight: bold; font-size: 0.9em; color: #555; }
    .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-top: 3px; }
    .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <label>관리자 토큰(일정 추가시 필요): <input type="password" id="github-token" placeholder="github_pat_..."></label>
  </div>

  <div class="header">
    <button onclick="changeMonth(-1)">◀ 이전달</button>
    <h2 id="month-title"></h2>
    <button onclick="changeMonth(1)">다음달 ▶</button>
  </div>

  <div class="grid" id="calendar-days">
    <div class="day-name sun">일</div><div class="day-name">월</div><div class="day-name">화</div>
    <div class="day-name">수</div><div class="day-name">목</div><div class="day-name">금</div><div class="day-name sat">토</div>
  </div>
  <div class="grid" id="calendar-grid"></div>

  <!-- 일정 입력 팝업창 -->
  <div id="schedule-modal" class="modal">
    <div class="modal-content">
      <h3>일정 등록</h3>
      <div><label>시작 날짜</label><input type="date" id="start-date"></div>
      <div><label>종료 날짜</label><input type="date" id="end-date"></div>
      <div>
        <label>일정 종류</label>
        <select id="event-type">
          <option value="업무">업무</option>
          <option value="부재">부재</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div>
        <label>인원</label>
        <select id="event-person">
          <option value="인원1">인원1</option>
          <option value="인원2">인원2</option>
          <option value="인원3">인원3</option>
        </select>
      </div>
      <div><label>세부 내용</label><textarea id="event-details" rows="3" placeholder="내용을 입력하세요"></textarea></div>
      <div class="btn-group">
        <button onclick="closeModal()">취소</button>
        <button onclick="saveSchedule()" style="background:#007bff; color:white; border:none;">저장 및 동기화</button>
      </div>
    </div>
  </div>

  <script>
    const REPO = "sol8923/sh23.github.io";
    const FILE_PATH = "schedule.json";
    const API_URL = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;
    
    let currentDate = new Date();
    let scheduleData = [];

    const fixedHolidays = {
      "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일",
      "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "크리스마스"
    };
    const yearlyHolidays = {
      "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
      "2026-03-02": "대체공휴일", "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
      "2026-08-17": "대체공휴일", "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴"
    };

    // 1. 화면 로딩 시 데이터 조회 (403 에러가 나도 화면은 띄우도록 에러 처리 강화)
    async function fetchSchedule() {
      try {
        const res = await fetch(API_URL + "?t=" + new Date().getTime());
        if (res.ok) {
          const data = await res.json();
          const decoded = decodeURIComponent(escape(atob(data.content)));
          scheduleData = JSON.parse(decoded);
        } else {
          console.warn("현재 조회 횟수 제한(시간당 60회)에 걸려 기존 일정을 불러오지 못했습니다. 일정 추가는 정상 작동합니다.");
        }
      } catch (e) {
        console.error("데이터 로드 실패", e);
      }
      renderCalendar();
    }

    // 2. 달력 그리기
    function renderCalendar() {
      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";
      
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById("month-title").innerText = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for(let i=0; i<firstDay; i++) { grid.innerHTML += `<div class="date-cell" style="background:transparent; border-color:transparent;"></div>`; }

      for(let i=1; i<=lastDate; i++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        const monthDayStr = `${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        const dayOfWeek = new Date(year, month, i).getDay();
        
        let cellClass = "date-cell";
        if (dayOfWeek === 0) cellClass += " sun";
        if (dayOfWeek === 6) cellClass += " sat";

        let holidayName = yearlyHolidays[dateStr] || fixedHolidays[monthDayStr];
        let holidayHtml = holidayName ? `<div class="holiday-name">${holidayName}</div>` : "";
        if (holidayName) cellClass += " holiday";

        let eventsHtml = "";
        scheduleData.forEach(evt => {
          if (dateStr >= evt.startDate && dateStr <= evt.endDate) {
            eventsHtml += `
              <div class="event-item type-${evt.type}">
                <strong>[${evt.type}]</strong> ${evt.person} <br>
                <span style="color:#666;">${evt.details}</span>
              </div>
            `;
          }
        });

        grid.innerHTML += `
          <div class="${cellClass}" onclick="openModal('${dateStr}')">
            <span class="date-num">${i}</span>
            ${holidayHtml}
            <div class="event-container">${eventsHtml}</div>
          </div>
        `;
      }
    }

    function changeMonth(step) {
      currentDate.setMonth(currentDate.getMonth() + step);
      renderCalendar();
    }

    function openModal(date) {
      document.getElementById('start-date').value = date;
      document.getElementById('end-date').value = date;
      document.getElementById('schedule-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('schedule-modal').style.display = 'none';
      document.getElementById('event-details').value = "";
    }

    // 3. 깃허브에 데이터 저장하기 (토큰을 이용해 409 에러 완벽 차단)
    async function saveSchedule() {
      const token = document.getElementById("github-token").value;
      if (!token) {
        alert("상단 우측에 발급받은 관리자 토큰을 입력하셔야 일정을 저장할 수 있습니다.");
        return;
      }

      const start = document.getElementById("start-date").value;
      const end = document.getElementById("end-date").value;
      if(start > end) {
        alert("종료 날짜가 시작 날짜보다 빠를 수 없습니다.");
        return;
      }

      const btn = document.querySelector(".btn-group button:last-child");
      btn.innerText = "저장 중...";
      btn.disabled = true;

      try {
        // [핵심 해결책] 저장하기 직전, 토큰을 사용해 최신 파일의 열쇠(SHA)를 무조건 얻어옵니다.
        const getRes = await fetch(API_URL + "?t=" + new Date().getTime(), {
          headers: { "Authorization": `token ${token}` }
        });
        
        if (!getRes.ok) throw new Error("최신 동기화 데이터를 가져오는 데 실패했습니다.");
        
        const getData = await getRes.json();
        const currentSha = getData.sha;
        const decoded = decodeURIComponent(escape(atob(getData.content)));
        let currentData = JSON.parse(decoded);

        // 새 일정 추가
        const newEvent = {
          id: Date.now(),
          startDate: start,
          endDate: end,
          type: document.getElementById("event-type").value,
          person: document.getElementById("event-person").value,
          details: document.getElementById("event-details").value
        };
        currentData.push(newEvent);

        // 깃허브로 전송
        const jsonStr = JSON.stringify(currentData, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(jsonStr)));

        const putRes = await fetch(API_URL, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "일정 추가",
            content: encodedContent,
            sha: currentSha // 방금 가져온 최신 열쇠(SHA)를 넣음
          })
        });

        if (putRes.ok) {
          alert("성공적으로 일정이 저장되었습니다!");
          scheduleData = currentData; // 화면 데이터 즉시 갱신
          closeModal();
          renderCalendar();
        } else {
          alert("저장 실패: 토큰 권한을 다시 확인해 주세요.");
        }
      } catch (e) {
        console.error(e);
        alert("저장 중 오류가 발생했습니다. 토큰이 정확한지 확인해 주세요.");
      } finally {
        btn.innerText = "저장 및 동기화";
        btn.disabled = false;
      }
    }

    fetchSchedule();
  </script>
</body>
</html>
